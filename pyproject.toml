[project]
name = "pagespeed-census"
version = "0.1.0"
description = "Reproducible census of the mod_pagespeed / ngx_pagespeed installed base from HTTP Archive data"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "google-cloud-bigquery>=3.27,<4",
  "pyasn>=1.6.1",
]

[project.scripts]
census = "census.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/census"]

[tool.uv]
package = true
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bq: talks to BigQuery (dry runs only); needs CENSUS_BQ=1"]
